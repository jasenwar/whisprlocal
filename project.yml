name: WhisprLocal
options:
  bundleIdPrefix: com.jasenguerra
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  SherpaRuntime:
    path: Packages/SherpaRuntime
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: true
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: LWHJ76XFS5
    CODE_SIGN_IDENTITY: Apple Development
targets:
  WhisprLocal:
    type: application
    platform: macOS
    sources:
      - path: Sources/WhisprLocal
      - path: Vendor/LocalCleanupRuntime
        buildPhase: resources
        type: folder
    dependencies:
      - package: SherpaRuntime
        product: SherpaRuntime
      - target: WhisprLocalLoginHelper
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasenguerra.whisprlocal
        PRODUCT_NAME: WhisprLocal
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/WhisprLocal.entitlements
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lc++"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
    preBuildScripts:
      - name: Build MediaRemote adapter
        basedOnDependencyAnalysis: false
        script: |
          /bin/zsh "$SRCROOT/script/build_media_remote_adapter.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MediaRemoteRuntime"
      - name: Normalize ONNX Runtime framework links
        basedOnDependencyAnalysis: false
        script: |
          framework="$BUILD_DIR/../../SourcePackages/artifacts/onnxruntime-libs/OnnxruntimeMacOS/onnxruntime.xcframework/macos-arm64_x86_64/onnxruntime.framework"
          if [[ -d "$framework/Versions/Current" && ! -L "$framework/Versions/Current" ]]; then
            mv "$framework/Versions/Current" "$TARGET_TEMP_DIR/onnxruntime-source-current-$RANDOM"
            ln -s A "$framework/Versions/Current"
          fi
          if [[ -d "$framework/Resources" && ! -L "$framework/Resources" ]]; then
            mv "$framework/Resources" "$TARGET_TEMP_DIR/onnxruntime-source-resources-$RANDOM"
            ln -s Versions/Current/Resources "$framework/Resources"
          fi
    postBuildScripts:
      - name: Embed login helper
        basedOnDependencyAnalysis: false
        script: |
          source="$BUILT_PRODUCTS_DIR/WhisprLocalLoginHelper.app"
          destination="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LoginItems/WhisprLocalLoginHelper.app"
          if [[ ! -d "$source" ]]; then
            echo "error: WhisprLocalLoginHelper.app was not built"
            exit 1
          fi
          if [[ -d "$destination" ]]; then
            mv "$destination" "$TARGET_TEMP_DIR/WhisprLocalLoginHelper-previous-$RANDOM.app"
          fi
          mkdir -p "$(dirname "$destination")"
          /usr/bin/ditto "$source" "$destination"
      - name: Sign local runtimes
        basedOnDependencyAnalysis: false
        script: |
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"

          login_helper="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LoginItems/WhisprLocalLoginHelper.app"
          if [[ -d "$login_helper" ]]; then
            /usr/bin/codesign --force --sign "$identity" --options runtime --timestamp=none "$login_helper"
          fi

          media_framework="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/MediaRemoteRuntime/MediaRemoteAdapter.framework"
          if [[ -d "$media_framework" ]]; then
            /usr/bin/codesign --force --sign "$identity" --options runtime --timestamp=none "$media_framework"
          fi

          runtime="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/LocalCleanupRuntime"
          if [[ -x "$runtime/llama-server" ]]; then
            for library in "$runtime"/*.dylib; do
              /usr/bin/codesign --force --sign "$identity" --options runtime --timestamp=none "$library"
            done
            /usr/bin/codesign --force --sign "$identity" --options runtime --timestamp=none "$runtime/llama-server"
          fi
  WhisprLocalLoginHelper:
    type: application
    platform: macOS
    sources:
      - path: Sources/WhisprLocalLoginHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasenguerra.whisprlocal.loginhelper
        PRODUCT_NAME: WhisprLocalLoginHelper
        INFOPLIST_FILE: Config/LoginHelper-Info.plist
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: false
  WhisprLocalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WhisprLocalTests
        excludes:
          - Fixtures
      - path: Tests/WhisprLocalTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: WhisprLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasenguerra.whisprlocal.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LWHJ76XFS5
        CODE_SIGN_IDENTITY: Apple Development
schemes:
  WhisprLocal:
    build:
      targets:
        WhisprLocal: all
        WhisprLocalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhisprLocalTests
    archive:
      config: Release
